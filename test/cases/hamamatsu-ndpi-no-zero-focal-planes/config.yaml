# fork-local: upstream ignores focal planes other than 0 and fails to find
# any level.  The fork exposes every focal plane as a level, so the slide
# opens without plane 0.
base: Hamamatsu/CMU-1.ndpi
slide: CMU-1.ndpi
success: true
vendor: hamamatsu
properties:
  # no full-resolution level is focal plane 0
  hamamatsu.BestFocusLayer: ~
  openslide.level-count: '1'
