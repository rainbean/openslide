# fork-local: upstream corrupts a down-sample level and expects it to
# fail.  The fork reads only zoom level 0 (and the smallest level for
# the quickhash), so the slide opens with only the full-resolution
# level and reads cleanly.
base: Mirax/CMU-1.zip
slide: CMU-1.mrxs
success: true
vendor: mirax
regions:
- [9919, 103938, 0, 100, 100]
properties:
  openslide.level-count: "1"
