# fork-local: upstream corrupts a down-sample level and expects it to
# fail.  The fork drops down-sample levels, so the slide opens with
# only the full-resolution level and reads cleanly.
base: Mirax/Mirax2.2-4-PNG.zip
slide: Mirax2.2-4-PNG.mrxs
success: true
vendor: mirax
regions:
- [50000, 100000, 0, 100, 100]
properties:
  openslide.level-count: "1"
